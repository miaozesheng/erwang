<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面走丢了</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            position: relative;
        }

        .glitch {
            font-size: 12rem;
            font-weight: bold;
            color: #00f0ff;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
            animation: glitch 2s infinite;
            position: relative;
        }

        .glitch::before,
        .glitch::after {
            content: '404';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 #7b2dff;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 3s infinite linear alternate-reverse;
        }

        .glitch::after {
            left: -2px;
            text-shadow: -2px 0 #00ff88;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 2s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(30px, 9999px, 10px, 0); }
            20% { clip: rect(80px, 9999px, 90px, 0); }
            40% { clip: rect(20px, 9999px, 60px, 0); }
            60% { clip: rect(70px, 9999px, 50px, 0); }
            80% { clip: rect(50px, 9999px, 80px, 0); }
            100% { clip: rect(10px, 9999px, 40px, 0); }
        }

        .message {
            font-size: 1.5rem;
            color: #666;
            margin: 20px 0 40px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .terminal {
            background: rgba(18, 18, 26, 0.9);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 8px;
            padding: 20px 30px;
            display: inline-block;
            text-align: left;
        }

        .terminal-line {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }

        .prompt {
            color: #00ff88;
            margin-right: 10px;
        }

        .cmd {
            color: #e0e0e0;
        }

        .output {
            color: #666;
            padding-left: 20px;
            font-size: 0.9rem;
        }

        .btn {
            display: inline-block;
            margin-top: 40px;
            padding: 15px 40px;
            background: transparent;
            border: 1px solid #00f0ff;
            color: #00f0ff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            letter-spacing: 2px;
        }

        .btn:hover {
            background: rgba(0, 240, 255, 0.1);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
        }

        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(rgba(0, 240, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
        }

        .particle {
            position: fixed;
            width: 2px;
            height: 2px;
            background: #00f0ff;
            border-radius: 50%;
            pointer-events: none;
            animation: float 10s infinite;
            opacity: 0.5;
        }

        @keyframes float {
            0%, 100% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-10vh) translateX(50px); opacity: 0; }
        }

        @media (max-width: 768px) {
            .glitch {
                font-size: 6rem;
            }
            .message {
                font-size: 1rem;
            }
            .terminal {
                padding: 15px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="particle" style="left: 10%; animation-delay: 0s;"></div>
    <div class="particle" style="left: 30%; animation-delay: 2s;"></div>
    <div class="particle" style="left: 50%; animation-delay: 4s;"></div>
    <div class="particle" style="left: 70%; animation-delay: 1s;"></div>
    <div class="particle" style="left: 90%; animation-delay: 3s;"></div>

    <div class="container">
        <div class="glitch">404</div>
        <p class="message">Page Not Found</p>
        
        <div class="terminal">
            <div class="terminal-line">
                <span class="prompt">$</span>
                <span class="cmd">find page -path "/*"</span>
            </div>
            <div class="output">> 找不到任何匹配结果</div>
            <div class="terminal-line">
                <span class="prompt">$</span>
                <span class="cmd">echo $PAGE_STATUS</span>
            </div>
            <div class="output">> 404 - 目标已被删除或移动</div>
        </div>

        <a href="/" class="btn">返回首页</a>
    </div>

    <script>
        if (location.hash) {
            location.href = location.href.replace('/#', '');
        }
    </script>
</body>
</html>
