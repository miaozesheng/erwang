<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erwang's Blog</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #667eea;
        }
        .subtitle {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        .section {
            margin-bottom: 30px;
        }
        .section h2 {
            font-size: 1.3rem;
            color: #764ba2;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #eee;
        }
        .section p {
            color: #555;
            margin-bottom: 10px;
        }
        .links {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .links a {
            display: inline-block;
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .links a:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        footer {
            text-align: center;
            margin-top: 30px;
            color: #888;
            font-size: 0.9rem;
        }
        @media (max-width: 600px) {
            .card {
                padding: 25px;
            }
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Hello, I'm Erwang</h1>
            <p class="subtitle">Welcome to my personal blog</p>
            
            <div class="section">
                <h2>About Me</h2>
                <p>一个热爱技术、喜欢折腾的开发者。在这个博客里，我会分享一些技术心得、生活感悟。</p>
            </div>
            
            <div class="section">
                <h2>Quick Links</h2>
                <div class="links">
                    <a href="https://github.com/miaozesheng" target="_blank">GitHub</a>
                </div>
            </div>
            
            <div class="section">
                <h2>Recent Posts</h2>
                <p>博客正在建设中，内容即将上线...</p>
            </div>
            
            <footer>
                <p>&copy; 2026 Erwang. All rights reserved.</p>
            </footer>
        </div>
    </div>
</body>
</html>
