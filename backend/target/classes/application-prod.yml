server:
  port: ${SERVER_PORT:9090}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:blog}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:changeme}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

jwt:
  secret: ${JWT_SECRET:please-set-a-secure-jwt-secret-in-env}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  upload-dir: ${APP_UPLOAD_DIR:/www/server/erwang/uploads}

cors:
  allowed-origins: ${CORS_ORIGINS:https://erwang.me,https://www.erwang.me}

logging:
  level:
    com.erwang.blog: INFO
